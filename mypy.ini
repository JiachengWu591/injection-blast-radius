; Type checking. Scoped to the ibr/ package: that is where the data contracts
; and the security boundary live, so it is where a type error is most likely to
; be a real defect rather than a nuisance.
;
; This pass earned its place. It found three real problems on first run: an
; unguarded `response.usage` that would have crashed the smoke test on a
; provider quirk, a `.function` read on an SDK union that has a member without
; it, and one variable reused for two unrelated result types in the comparison
; harness.
;
; ASCII only, deliberately. configparser opens this file with the locale
; encoding, not UTF-8, so a typographic dash here raises UnicodeDecodeError on
; a machine whose default codepage is not UTF-8 while working fine in CI. That
; is the worst shape of bug: invisible to the person who added it.

[mypy]
python_version = 3.12
files = ibr
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
