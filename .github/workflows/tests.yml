name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-assertions:
    # Only the assertions that need no API key: the schema contracts, the
    # executor whitelist, the sandbox guard, the log format, and the report
    # renderer. These are the guarantees that must hold regardless of how any
    # model behaves on a given day, so they are also the ones worth gating on.
    #
    # Phase 1's assertions are deliberately excluded: every one of them tests
    # how a real model responds to an injection, which costs money and is
    # probabilistic by nature (see PROJECT_SPEC.md §1.1). Running those in CI
    # would buy flaky red builds, not confidence. Run them locally with
    # `python tests/test_phase1.py`.
    runs-on: ubuntu-latest

    steps:
      # v7 of both runs on node24. v4/v5 target the deprecated node20 and get
      # force-migrated by the runner with a warning.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # The tool list lives in requirements-dev.txt, not here: CI and a
        # contributor's machine checking with different tools is a difference
        # that only shows up as a CI failure nobody can reproduce.
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: The diagrams stay renderable on GitHub
        # ARCHITECTURE.md's class diagram once came back "Unable to render rich
        # display" here while parsing and rendering fine locally under mermaid
        # 9.4.3, 10.9.8 and 11. The lint was added to stop that recurring — and
        # it was only wired into verify.py, so a contributor who did not run
        # verify.py could have reintroduced the same construct and CI would
        # have passed it. A regression guard that does not run where changes
        # arrive is not a guard.
        run: python tools/check_mermaid.py

      - name: Every type-checker suppression is registered with a reason
        # A `# type: ignore` on a whole call once collapsed a response object
        # to Any and switched off checking for everything derived from it,
        # hiding a bug identical to one already fixed elsewhere for four
        # commits. Suppressions are sometimes correct; adding one silently
        # is not.
        run: coverage run --append --source=ibr tests/test_suppressions.py

      - name: Architecture — both diagrams, checked against the code
        # ARCHITECTURE.md draws a layered package diagram and a UML class
        # diagram. A drawing goes stale the first time someone adds an import
        # or renames a field and nothing fails, which is worse than no drawing
        # because a reader trusts it.
        #
        # So the layers are derived from the imports, and the class diagram's
        # field lists, their order, the frozen claim and the <<interface>>
        # stereotypes are parsed back out of the markdown and compared against
        # dataclasses.fields() and the real Protocols — in both languages.
        run: coverage run --append --source=ibr tests/test_architecture.py

      - name: Phase 0 — sandbox, fixtures, credential hygiene
        run: coverage run --append --source=ibr tests/test_phase0.py

      - name: Phase 2 — structural boundary
        run: coverage run --append --source=ibr tests/test_phase2.py --offline

      - name: Phase 3 — observability
        run: coverage run --append --source=ibr tests/test_phase3.py --offline

      - name: Phase 4 — comparison report
        run: coverage run --append --source=ibr tests/test_phase4.py --offline

      - name: Attack corpus — safety rails and matrix rendering
        run: coverage run --append --source=ibr tests/test_attack_corpus.py --offline

      - name: Audit variance — statistics and reporting honesty
        run: coverage run --append --source=ibr tests/test_variance.py --offline

      - name: Replay — the API-calling paths, from recorded exchanges
        # Drives the retry loop, the four pipeline stages, and the baseline's
        # multi-turn tool loop against committed recordings. These modules sat
        # near 40% because reaching them needs a key, and they are where the
        # last several real bugs lived. Now ~80% with no network.
        run: coverage run --append --source=ibr tests/test_replay.py

      - name: Fail-closed paths, from constructed responses
        # PROJECT_SPEC.md §1.4 is the strictest rule in the project and had no
        # end-to-end test: both of the pipeline's fail-closed branches and most
        # of the retry handling were unexecuted by any assertion. Truncated
        # arguments and dropped connections cannot be recorded on demand, so
        # these responses are constructed — and each one must say why.
        run: coverage run --append --source=ibr tests/test_failure_paths.py

      - name: Properties — the security invariants, over generated inputs
        # Line coverage says every line ran, not that it ran on the input that
        # breaks it. The hand-written path vectors are the cases I thought of;
        # these are the ones I did not. This pass is what found that the guard
        # raised ValueError on an embedded null byte — an exception the tool
        # backend does not catch, so a model could abort a run with it.
        run: coverage run --append --source=ibr tests/test_properties.py

      - name: Seams — a second source and a second sink
        # The two places an adopter is expected to replace. A protocol with one
        # implementation is indistinguishable from a description of that
        # implementation, so these assertions run against the non-default one.
        # They also pin down what the seams must NOT do: a sink is never
        # consulted on a no_action path, and the output audit still runs before
        # it. Both were confirmed by breaking the executor and watching exactly
        # the intended assertion fail.
        run: coverage run --append --source=ibr tests/test_seams.py

      - name: Onboarding — the one-command start, and what it may claim
        # README.md promises `mise run demo` works on an empty machine with no
        # key. Most of that promise is about someone else's laptop; what runs
        # here is the part that can be checked — the command exists, the thing
        # it runs works with the key stripped from the environment, and the
        # report it produces does not describe replayed rows as a live run.
        run: coverage run --append --source=ibr tests/test_onboarding.py

      - name: The benign corpus is benign, and fictional
        # 165 issues that serve as the control group for the false-positive
        # measurement. Every block counts as a false positive, so one real
        # injection hiding in here would be counted as the audit wrongly
        # stopping a legitimate report — the exact opposite of the truth.
        #
        # The corpus was generated and then reviewed stratum by stratum, and
        # that review was inconsistent: it flagged a plausibly-real package
        # name in one stratum and passed the same name in five others, because
        # each stratum had its own reviewer and none saw the whole file. These
        # assertions are what replaces that judgement.
        run: coverage run --append --source=ibr tests/test_corpus.py

      - name: Batch runner and the idempotency ledger
        # Two invariants, failing in opposite directions. An error must never
        # read as a decision — this project shipped that bug twice, so
        # IssueOutcome.status has three values rather than two. And an action
        # must happen exactly once: the ledger writes an intent before the sink
        # runs and a confirmation after, so an interrupted run leaves a trace
        # that cannot be resolved by guessing.
        #
        # Six deliberate breakages were tried against these. Five fired; the
        # sixth — deleting the pre-write, which silently turns the ledger
        # single-phase and makes a resumed run post twice — fired nothing until
        # test_the_intent_is_on_disk_before_the_inner_sink_runs was added to
        # watch the ordering from inside the call.
        run: coverage run --append --source=ibr tests/test_batch.py

      - name: The false-positive estimand
        # false_positive_rate.py produces a number that goes in README.md, and
        # the part that can be wrong without anything looking wrong is the
        # arithmetic between the verdicts and the headline. An off-by-one in
        # the majority rule, or counting an unmeasurable issue as a pass, would
        # silently change the published rate — the second one would let a bad
        # afternoon on the provider's side improve it. Both breakages were
        # tried; both fire.
        run: coverage run --append --source=ibr tests/test_false_positive.py

      - name: The de-identifier, in both directions
        # PROJECT_SPEC.md §6.1 authorises reading real issue text on the
        # condition that it is de-identified and that the limits are stated.
        # This checks both halves.
        #
        # Over-scrubbing is not the safe direction. The reason to use real
        # issues is that their prose is real, and the first version of this
        # module turned every `@property` in a pandas issue into a pseudonym
        # and would have mangled every traceback. Both directions are asserted:
        # emails, mentions, home paths and URL paths go; decorators, version
        # strings and site-packages tracebacks stay byte-identical.
        #
        # The load-bearing assertion is that residual_risks() stays non-empty.
        # The moment that module reads as complete, §6.1's authorisation is
        # being relied on for more than it grants.
        run: coverage run --append --source=ibr tests/test_deidentify.py

      - name: Real-corpus fetcher — retry category, id namespace, drop policy
        # Everything the fetcher decides before it touches the network or a
        # model, which is the part that can be checked in CI at all.
        #
        # Three of these exist because three long fetches died to three
        # different transient network failures, each escaping an `except` that
        # listed the errors I had thought of instead of the category they
        # belong to. The rest pin the review's four-way split: a single
        # "identifies someone" boolean was dropping genuine bug reports for
        # naming an API they called, and merging the questions again would
        # quietly remove whatever makes each repository different.
        run: coverage run --append --source=ibr tests/test_fetch_real.py

      - name: Require full coverage of the security-critical modules
        # These are the structural boundary: the schema parsers, the executor
        # whitelist, the sandbox guard, the sink the executor publishes through,
        # and the paths/constants they depend on. They must be exercised
        # entirely by tests that make no API calls, because "the boundary holds"
        # is the one claim this project cannot afford to be taking on trust.
        #
        # A coverage sweep found the executor at 75%: the label_bug and
        # label_question arms of the whitelist had no offline test, and neither
        # did the output-audit blocking branch. Half the enumerated action set
        # was unverified. This gate is here so that cannot recur quietly.
        #
        # ibr/sinks.py joined the list when the executor stopped writing files
        # itself: an untested branch in a sink is an untested branch on the
        # publication path. ibr/sources.py deliberately did not — it decides
        # what gets read, and no source can widen the set of reachable actions.
        run: |
          coverage report --show-missing \
            --include='ibr/schemas.py,ibr/executor.py,ibr/sandbox_fs.py,ibr/config.py,ibr/sinks.py' \
            --fail-under=100

      - name: Coverage summary (informational)
        # The remaining modules are dominated by API-calling paths that the
        # offline suite cannot reach by design; they are covered by the live
        # tests, which do not run here.
        run: coverage report --show-missing

      - name: Confirm the offline suite really is offline
        # The steps above pass with no DEEPSEEK_API_KEY configured, which is
        # the actual guarantee: a test that reached the network would have
        # failed on the missing key rather than silently making a call.
        #
        # This is not hypothetical. Three assertions once passed locally and
        # broke here, because they monkeypatched the request function but still
        # let audit_only build a client first — so they needed a key to prove
        # they needed no key. A developer machine with a .env cannot catch
        # that; only a run with no key can.
        run: |
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY is set in a workflow that must not use it"
            exit 1
          fi
          if [ -f .env ]; then
            echo ".env exists in CI; the offline guarantee is not being tested"
            exit 1
          fi
          echo "No API key and no .env — the suite above ran entirely offline."
